<!DOCTYPE html>
<html lang="hr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parfume </title>

    <link rel="stylesheet" href="dist/output.css" />
    <script type="module" src="js/main.js"></script>
</head>
<body class="bg-blue-100 font-mono text-slate-800">
   
    <main class="mx-auto max-w-5xl p-4">

        <header class="mb-4">
            <h1 class="bg-blue-300 rounded-2xl p-6 text-center text-4xl font-bold">Lista parfema</h1>
        </header>

        <p id="loading" class="grid gap-4 sm:grid-cols-2 md:grid-cols-3 m-2 font-bold text-xl"> Učitavanje popisa parfema.</p>
        <p class="m-2"> Ovo je stranica koja prikazuje popis muških i ženskih parfema različitih marki. Parfemi koji oko svoje kartice imaju plavi obrub koštaju ispod 100 EUR. </p>
        <p id="count" class="text-slate-500 m-1.5"></p>
        <div id="list" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-6"></div>
        <p id="empty" class="hidden rounded-lg bg-white p-4 text-center">Trenutno nema parfema za prikaz. Hvala Vam na strpljenju!</p>

        <footer class="bg-blue-300 rounded-2xl p-6 mt-4 text-center font-semibold">© 2026 Lista parfema by Vita</footer>
    </main>
</body>
